spring:
  profiles:
    default: dev
  application:
    name: agservpro-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    session:
      timeout: 30m
      cookie:
        name: AGSERVPRO_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE}
        same-site: lax

app:
  public-url: ${APP_PUBLIC_URL}
  invitation-expiration-hours: ${INVITATION_EXPIRATION_HOURS:24}
  bootstrap:
    admin-name: ${ADMIN_SAAS_NAME:}
    admin-email: ${ADMIN_SAAS_EMAIL:}
    admin-password: ${ADMIN_SAAS_PASSWORD:}

server:
  port: ${PORT:8080}
