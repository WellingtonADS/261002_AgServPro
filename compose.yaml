services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agservpro
      POSTGRES_USER: agservpro
      POSTGRES_PASSWORD: agservpro
    ports:
      - "5432:5432"
    volumes:
      - agservpro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agservpro -d agservpro"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agservpro-postgres:
